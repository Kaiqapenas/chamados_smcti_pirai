{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIGEC</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="{% static 'css/style_chamados.css' %}"> 
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h1>SIGEC</h1>
            <p>Sistema Integrado de Gestão de Estoque e Chamados</p>
        </div>
        <div class="auth-body">
            <form action="{% url 'core:login' %}" method="POST">
                {% csrf_token %}
                <div class="auth-input-group">
                    <input type="text" name="matricula" placeholder="Matrícula" value="{{ request.POST.matricula }}" required>
                </div>
                <div class="auth-input-group">
                    <input type="password" name="password" placeholder="Senha" required>
                </div>
                {% if erro %}
                    <div class="error-msg" style="display:block;">{{ erro }}</div>
                {% endif %}
                <button type="submit" class="btn-green">Entrar</button>
            </form>
            <a href="{% url 'core:recuperar_senha' %}" class="forgot-link">Esqueci minha senha</a>
        </div>
        <div class="auth-footer">
            <img src="{% static 'image/prefeitura-pirai.png' %}" alt="Prefeitura de Piraí">
        </div>
    </div>
</body>
</html>
