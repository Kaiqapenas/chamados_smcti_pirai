{% extends "base.html" %}
{% load static %}

{% block titulo %}SIGEC - Sistema de Chamados{% endblock %}

{% block head %}_
    <link rel="stylesheet" href="{% static 'css/style_chamados.css' %}">
{% endblock head %}

{% block main %}
    <div class="tickets-page">
        <!-- Header -->
        <header class="tickets-header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="header-title">SIGEC - Sistema de Chamados</h1>
                </div>
                <div class="header-right">
                    <input type="text" placeholder="Buscar" class="search-input">
                    <a href="{% url 'chamados:novo_cadastro' %}" class="btn-new-ticket">+ Novo Chamado</a>
                </div>
            </div>
        </header>

        <div class="tickets-container">
            <!-- Main Content -->
            <main class="main-content">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active">Todos</button>
                </div>

                <!-- Filters -->
                <div class="filters">
                    <div class="filter-group">
                        <label>Período:</label>
                        <select class="filter-select">
                            <option value="daily">Diário</option>
                            <option value="monthly">Mensal</option>
                            <option value="annual">Anual</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Status:</label>
                        <select class="filter-select">
                            <option value="all">Todos os status</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Em andamento">Em andamento</option>
                            <option value="Concluído">Concluído</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Urgência:</label>
                        <select class="filter-select">
                            <option value="all">Todos os status</option>
                            <option value="Padrão">Padrão</option>
                            <option value="Urgente">Urgente</option>
                        </select>
                    </div>
                </div>

            </main>
        </div>
    </div>
{% endblock main %}

{% block scripts %}
    <script src="{% static 'chamados/js/buttonselect.js' %}"></script>
    <script src="{% static 'chamados/js/modal.js' %}"></script>
{% endblock scripts %}
